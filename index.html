<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشاط تفاعلي: معوقات تطوير المنهج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f4f8; /* لون خلفية مريح */
        }
        .selected {
            border: 3px solid #ffcc00 !important;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .phrase-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .phrase-card:hover {
            transform: translateY(-2px);
        }
        /* ألوان جامعة الإمام (تقريبية لتعطي طابع رسمي) */
        .bg-imam-blue { background-color: #003865; }
        .text-imam-blue { color: #003865; }
        .bg-imam-gold { background-color: #d4af37; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <!-- رأس الصفحة -->
    <header class="text-center mb-8 w-full max-w-6xl">
        <h1 class="text-3xl md:text-4xl font-bold text-imam-blue mb-2">نشاط إثرائي: أين يكمن العائق؟</h1>
        <p class="text-lg text-gray-600">انقري على العبارة لاختيارها، ثم انقري على العمود المناسب لتصنيفها. (العبارات تتغير عشوائياً في كل محاولة)</p>
    </header>

    <!-- منطقة الأعمدة الثلاثة -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl mb-8">
        <!-- المعوقات الداخلية -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden border-t-8 border-blue-500 column-container" onclick="moveToColumn('internal')">
            <div class="bg-blue-100 py-3 px-4 text-center border-b border-blue-200">
                <h2 class="text-xl font-bold text-blue-800">المعوقات الداخلية</h2>
            </div>
            <div id="internal-zone" class="p-4 min-h-[250px] flex flex-col gap-3">
                <!-- يتم نقل العناصر هنا -->
            </div>
        </div>

        <!-- المعوقات المشتركة -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden border-t-8 border-purple-500 column-container" onclick="moveToColumn('shared')">
            <div class="bg-purple-100 py-3 px-4 text-center border-b border-purple-200">
                <h2 class="text-xl font-bold text-purple-800">المعوقات المشتركة</h2>
            </div>
            <div id="shared-zone" class="p-4 min-h-[250px] flex flex-col gap-3">
                <!-- يتم نقل العناصر هنا -->
            </div>
        </div>

        <!-- المعوقات الخارجية -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden border-t-8 border-green-500 column-container" onclick="moveToColumn('external')">
            <div class="bg-green-100 py-3 px-4 text-center border-b border-green-200">
                <h2 class="text-xl font-bold text-green-800">المعوقات الخارجية</h2>
            </div>
            <div id="external-zone" class="p-4 min-h-[250px] flex flex-col gap-3">
                <!-- يتم نقل العناصر هنا -->
            </div>
        </div>
    </div>

    <!-- بنك العبارات (المصدر) -->
    <div class="w-full max-w-6xl bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-200">
        <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">بنك العبارات (انقري للاختيار)</h3>
        <div id="bank-zone" class="flex flex-wrap gap-3 justify-center min-h-[100px]" onclick="moveToColumn('bank')">
            <!-- سيتم توليد العبارات هنا برمجياً -->
        </div>
    </div>

    <!-- أزرار التحكم -->
    <div class="flex gap-4">
        <button onclick="checkAnswers()" class="bg-imam-blue text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-blue-800 transition shadow-lg flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            تحقق من الإجابات
        </button>
        <button onclick="initGame()" class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg font-bold text-lg hover:bg-gray-300 transition shadow flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            إعادة ومحاولة جديدة
        </button>
    </div>

    <!-- رسالة النتيجة -->
    <div id="result-message" class="mt-6 text-2xl font-bold hidden px-8 py-4 rounded-xl shadow-lg text-center"></div>

    <script>
        // بنك العبارات المطابق تماماً لمحتوى العرض دون أي إضافات
        const allBarriers = [
            // داخلية
            { text: "غياب فلسفة تربوية واضحة", category: "internal" },
            { text: "التداخل بين مصادر ومجالات المنهج", category: "internal" },
            { text: "الافتقار إلى التدريب الكافي", category: "internal" },
            { text: "قصور الأنشطة التعليمية وبرامج التقويم", category: "internal" },
            { text: "البيروقراطية والإجراءات الإدارية البطيئة", category: "internal" },
            
            // خارجية
            { text: "عدم توافق المنهج مع احتياجات المجتمع", category: "external" },
            { text: "نقص المشاركة المجتمعية", category: "external" },
            { text: "نقص التمويل والموارد", category: "external" },
            
            // مشتركة
            { text: "مقاومة التغيير", category: "shared" }
        ];

        let selectedElement = null;

        // دالة لخلط المصفوفة عشوائياً
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // تهيئة اللعبة
        function initGame() {
            const bankZone = document.getElementById('bank-zone');
            const zones = ['internal-zone', 'external-zone', 'shared-zone'];
            
            // تنظيف جميع المناطق
            bankZone.innerHTML = '';
            zones.forEach(id => document.getElementById(id).innerHTML = '');
            
            // إخفاء رسالة النتيجة
            const resultMsg = document.getElementById('result-message');
            resultMsg.classList.add('hidden');
            resultMsg.className = 'mt-6 text-2xl font-bold hidden px-8 py-4 rounded-xl shadow-lg text-center';

            selectedElement = null;

            // خلط العبارات الـ 9 الموجودة في العرض وعرضها بالكامل
            const gameItems = shuffle([...allBarriers]);

            // إنشاء البطاقات في البنك
            gameItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'phrase-card bg-gray-50 border-2 border-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm md:text-base shadow-sm font-medium select-none flex justify-between items-center gap-2';
                div.innerHTML = `<span>${item.text}</span><span class="status-icon text-lg"></span>`;
                div.dataset.category = item.category;
                div.dataset.id = 'item-' + index;
                
                // حدث النقر لاختيار العنصر
                div.onclick = function(e) {
                    e.stopPropagation(); // منع انتقال النقر للعمود
                    selectItem(div);
                };

                bankZone.appendChild(div);
            });
        }

        // اختيار عنصر
        function selectItem(element) {
            // إزالة التحديد السابق
            if (selectedElement) {
                selectedElement.classList.remove('selected', 'border-yellow-400');
            }
            
            // إذا تم النقر على نفس العنصر، قم بإلغاء تحديده
            if (selectedElement === element) {
                selectedElement = null;
                return;
            }

            // تحديد العنصر الجديد
            selectedElement = element;
            selectedElement.classList.add('selected', 'border-yellow-400');
        }

        // نقل العنصر المحدد إلى عمود
        function moveToColumn(columnPrefix) {
            if (!selectedElement) return; // لا تفعل شيئاً إذا لم يكن هناك عنصر محدد

            const targetZoneId = columnPrefix === 'bank' ? 'bank-zone' : columnPrefix + '-zone';
            const targetZone = document.getElementById(targetZoneId);
            
            // إزالة التنسيقات الخاصة بالتحقق السابقة إن وجدت
            selectedElement.classList.remove('bg-green-100', 'border-green-500', 'text-green-800', 'bg-red-100', 'border-red-500', 'text-red-800');
            selectedElement.classList.add('bg-gray-50', 'border-gray-300', 'text-gray-800');
            
            // إزالة أي علامات صح أو خطأ سابقة عند نقل العنصر لتصحيح الإجابة
            selectedElement.querySelector('.status-icon').innerHTML = '';

            // إضافة العنصر للمنطقة الجديدة
            targetZone.appendChild(selectedElement);
            
            // إلغاء التحديد بعد النقل
            selectedElement.classList.remove('selected', 'border-yellow-400');
            selectedElement = null;
        }

        // التحقق من الإجابات
        function checkAnswers() {
            let correctCount = 0;
            let totalPlaced = 0;
            const totalItems = allBarriers.length; // المجموع 9 عبارات
            
            const zones = ['internal', 'external', 'shared'];
            
            zones.forEach(zoneType => {
                const container = document.getElementById(zoneType + '-zone');
                const items = container.children;
                
                for (let i = 0; i < items.length; i++) {
                    totalPlaced++;
                    const item = items[i];
                    const statusIcon = item.querySelector('.status-icon');
                    
                    // إعادة ضبط الألوان
                    item.classList.remove('bg-gray-50', 'border-gray-300', 'text-gray-800', 'bg-red-100', 'border-red-500', 'text-red-800', 'bg-green-100', 'border-green-500', 'text-green-800');
                    
                    if (item.dataset.category === zoneType) {
                        // إجابة صحيحة
                        item.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                        statusIcon.innerHTML = '✅'; // ظهور علامة الصح
                        correctCount++;
                    } else {
                        // إجابة خاطئة
                        item.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                        statusIcon.innerHTML = '❌'; // ظهور علامة الخطأ
                    }
                }
            });

            const resultMsg = document.getElementById('result-message');
            resultMsg.classList.remove('hidden');

            if (totalPlaced < totalItems) {
                resultMsg.textContent = `لقد قمت بتصنيف ${totalPlaced} عبارات من أصل ${totalItems}. يرجى إكمال الباقي!`;
                resultMsg.classList.add('bg-yellow-100', 'text-yellow-800', 'border-2', 'border-yellow-400');
            } else if (correctCount === totalItems) {
                resultMsg.textContent = "🎉 رائع جداً! إجابات صحيحة 100%.. أبدعتم!";
                resultMsg.classList.add('bg-green-100', 'text-green-800', 'border-2', 'border-green-500');
            } else {
                resultMsg.textContent = `محاولة جيدة! لديكم ${correctCount} إجابات صحيحة من أصل ${totalItems}. راجعوا البطاقات الحمراء.`;
                resultMsg.classList.add('bg-red-100', 'text-red-800', 'border-2', 'border-red-500');
            }
        }

        // تشغيل اللعبة عند تحميل الصفحة
        window.onload = initGame;
    </script>
</body>
</html>
